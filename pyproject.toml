[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-cancer-ml"
version = "0.1.0"
description = "Pipeline de ML para Breast Cancer Wisconsin (Diagnostic) — portfólio de Eric Guerrize"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Eric Guerrize" }]
keywords = ["machine-learning", "breast-cancer", "sklearn", "mlops", "portfolio"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pandera>=0.18",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "pre-commit>=3.6",
]
explain = ["shap>=0.44"]
mlflow = ["mlflow>=2.11"]
kaggle = ["kaggle>=1.6"]
all = ["breast-cancer-ml[dev,explain,mlflow,kaggle]"]

[project.scripts]
bcm = "breast_cancer_ml.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"dashboard/*" = ["B008", "E402"]
"src/breast_cancer_ml/cli.py" = ["B008"]
"notebooks/*" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["breast_cancer_ml"]
branch = true
